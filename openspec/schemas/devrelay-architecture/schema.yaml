name: devrelay-architecture
version: 1
description: Bounded OpenSpec designer capability for DevRelay ArchitectureDesign changes.

artifacts:
  - id: design
    generates: design.md
    description: Technical design input for the next DevRelay modeler step.
    template: design.md
    instruction: |
      Describe the technical approach, affected boundaries, interface intent,
      architecture constraints, decision candidates, assumptions, risks, and
      traceability for the approved change. Do not produce the canonical
      architecture model, diagrams, final MADR records, detailed interface
      contracts, tasks, implementation, or approval claims. Those belong to
      other configured DevRelay steps or downstream Modules.
    requires: []
