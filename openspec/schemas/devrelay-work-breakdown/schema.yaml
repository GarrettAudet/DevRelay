name: devrelay-work-breakdown
version: 1
description: Bounded OpenSpec tasks capability for DevRelay WorkBreakdown.

artifacts:
  - id: tasks
    generates: tasks.md
    description: Native planning input normalized into a DevRelay work-breakdown candidate.
    template: tasks.md
    instruction: |
      Convert only the supplied approved scope into discrete bounded actions.
      For every action state its objective, scope, deliverables, deliverable-oriented
      work type, approved acceptance-criterion, architecture and contract references,
      provider-neutral required capabilities, non-authoritative dependency hints,
      verification plan, required evidence, and exact source references. Account for
      every authorized scope item with one proposed coverage disposition. Do not
      implement work, build code, assign specialists, choose owners, estimate, schedule,
      claim completion, author graph operations, or validate the dependency DAG.
    requires: []
