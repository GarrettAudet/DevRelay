name: materialize-release-candidate

on:
  workflow_dispatch:
  push:
    branches:
      - codex/lifecycle-run-report-completion
    paths:
      - .github/workflows/materialize-release-candidate.yml
      - scripts/run-release-candidate-materializer.mjs
      - handoff/2026-08-11-controlled-release-acceptance-pickup/candidate-materializer.wip.txt
      - src/business-acceptance-core.mjs
      - src/system-verification-core.mjs
      - src/system-verification-test-adapter.mjs
      - src/system-verification-review-adapter.mjs
      - src/system-verification-traceability-contributor.mjs
      - src/traceability-graph.mjs
      - project/**
      - dogfood/lifecycle-run-report/**
      - release/0.9.0.json

permissions:
  actions: write
  contents: write

jobs:
  materialize:
    name: Materialize controlled release candidate
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Bind DevRelay Java executable
        shell: bash
        run: echo "DEVRELAY_JAVA=${JAVA_HOME}/bin/java" >> "$GITHUB_ENV"
      - name: Install exact dependencies
        run: npm ci
      - name: Regenerate pre-candidate source catalog
        shell: bash
        run: |
          mkdir -p .devrelay
          npm run release:catalog
          cp release/0.9.0.json .devrelay/source-release-catalog.json
      - name: Upload source catalog bootstrap
        uses: actions/upload-artifact@v4
        with:
          name: source-release-catalog-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: .devrelay/source-release-catalog.json
      - name: Establish exact cataloged source commit
        id: source
        shell: bash
        run: |
          set -euo pipefail
          branch="$GITHUB_REF_NAME"
          starting_commit="$(git rev-parse HEAD)"
          catalog_changed=false
          if ! git diff --quiet -- release/0.9.0.json; then
            git fetch origin "$branch"
            remote_commit="$(git rev-parse "origin/${branch}")"
            if [[ "$remote_commit" != "$starting_commit" ]]; then
              echo "Branch advanced from ${starting_commit} to ${remote_commit}; refusing catalog commit." >&2
              exit 1
            fi
            if [[ -n "$(git status --short --untracked-files=no | grep -v '^ M release/0.9.0.json$' || true)" ]]; then
              echo "Files other than release/0.9.0.json changed during catalog generation." >&2
              git status --short
              exit 1
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add release/0.9.0.json
            git commit -m "Regenerate release catalog"
            git push origin "HEAD:${branch}"
            catalog_changed=true
          fi
          target_commit="$(git rev-parse HEAD)"
          echo "catalog_changed=${catalog_changed}" >> "$GITHUB_OUTPUT"
          echo "target_commit=${target_commit}" >> "$GITHUB_OUTPUT"
      - name: Dispatch verification for catalog commit
        if: steps.source.outputs.catalog_changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "/repos/${GITHUB_REPOSITORY}/actions/workflows/verify.yml/dispatches" -f ref="$GITHUB_REF_NAME"
      - name: Bind exact successful verify run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_COMMIT: ${{ steps.source.outputs.target_commit }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            runs="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${TARGET_COMMIT}&per_page=100" --jq '[.workflow_runs[] | select(.name == "verify" and (.event == "push" or .event == "workflow_dispatch"))] | sort_by(.created_at) | reverse')"
            run_id="$(jq -r '[.[] | select(.status == "completed" and .conclusion == "success")][0].id // empty' <<<"$runs")"
            if [[ -n "$run_id" ]]; then
              detail="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")"
              [[ "$(jq -r '.head_sha' <<<"$detail")" == "$TARGET_COMMIT" ]]
              [[ "$(jq -r '.name' <<<"$detail")" == "verify" ]]
              [[ "$(jq -r '.conclusion' <<<"$detail")" == "success" ]]
              echo "DEVRELAY_RELEASE_TARGET_COMMIT=${TARGET_COMMIT}" >> "$GITHUB_ENV"
              echo "DEVRELAY_RELEASE_CI_RUN=${run_id}" >> "$GITHUB_ENV"
              exit 0
            fi
            incomplete="$(jq '[.[] | select(.status != "completed")] | length' <<<"$runs")"
            failed="$(jq '[.[] | select(.status == "completed" and .conclusion != "success")] | length' <<<"$runs")"
            if [[ "$incomplete" == "0" && "$failed" != "0" ]]; then
              echo "Every exact verify run for ${TARGET_COMMIT} completed without success." >&2
              jq -r '.[] | [.id, .event, .status, .conclusion] | @tsv' <<<"$runs" >&2
              exit 1
            fi
            sleep 10
          done
          echo "No successful exact verify run was available for ${TARGET_COMMIT}." >&2
          exit 1
      - name: Materialize exact candidate through released APIs
        shell: bash
        run: node scripts/run-release-candidate-materializer.mjs | tee .devrelay/candidate-materialization-summary.json
      - name: Regenerate catalog for materialized bytes
        run: npm run release:catalog
      - name: Upload candidate and generated catalogs
        uses: actions/upload-artifact@v4
        with:
          name: controlled-release-candidate-${{ steps.source.outputs.target_commit }}
          if-no-files-found: error
          retention-days: 30
          path: |
            dogfood/release-acceptance/candidate-001
            .devrelay/candidate-materialization-summary.json
            .devrelay/source-release-catalog.json
            release/0.9.0.json
