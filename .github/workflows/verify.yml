name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-check:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        node:
          - 20.x
          - 22.x
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Bind DevRelay Java executable
        if: runner.os != 'Windows'
        shell: bash
        run: echo "DEVRELAY_JAVA=${JAVA_HOME}/bin/java" >> "$GITHUB_ENV"
      - name: Bind DevRelay Java executable on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "DEVRELAY_JAVA=$env:JAVA_HOME\bin\java.exe" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install exact dependencies
        run: npm ci
      - name: Verify source release
        run: npm run release:check
