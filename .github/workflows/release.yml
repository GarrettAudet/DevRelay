name: github-source-release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-source-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-verify-release:
    name: Build and verify GitHub source release
    permissions:
      attestations: write
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.x
          cache: npm
      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Bind DevRelay Java executable
        shell: bash
        run: echo "DEVRELAY_JAVA=${JAVA_HOME}/bin/java" >> "${GITHUB_ENV}"
      - name: Install exact dependencies
        run: npm ci
      - name: Verify exact source and installed package
        run: npm run release:check
      - name: Materialize release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          npm pack --pack-destination release-assets
          npm sbom --sbom-format=cyclonedx > release-assets/SBOM.cdx.json
          cp "release/$(node -p 'require("./package.json").version').json" release-assets/
          (cd release-assets && sha256sum * > SHA256SUMS)
      - name: Attest release assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'release-assets/*'
      - name: Upload immutable release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: github-source-release-${{ github.sha }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 30
  create-prerelease:
    name: Create prerelease from accepted tag
    if: github.event_name == 'push'
    needs: build-verify-release
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download attested release assets
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: github-source-release-${{ github.sha }}
          path: release-assets
      - name: Create prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release-assets/* --verify-tag --prerelease --generate-notes --title "DevRelay ${GITHUB_REF_NAME}"
